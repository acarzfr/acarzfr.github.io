project:
  type: website
  output-dir: docs
  
bibliography: references.bib

website:
  description: "Zafer Acar'ın kişisel internet sitesi"
  site-url: https://acarzfr.github.io
  repo-url: https://github.com/acarzfr/acarzfr.github.io
  title: "Acar Matematik"
  favicon: style/acarmatematik.png
  navbar:
    logo: style/acarmatematik.png
    background: "#F6F0EB"
    right:
      - text: "Hakkımda"
        href: about.qmd
      - icon: book
        href: https://acarzfr.github.io/books.html
      - icon: instagram
        href: https://www.instagram.com/acarmatematik/
      - icon: github
        href: https://github.com/acarzfr/
      - icon: rss
        href: index.xml
    repo-actions: [edit, issue]
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    background: "#F6F0EB"
    left: "© 2026 Zafer Acar • Acar Matematik"
    right: "Matematik Ders Notları ve Paylaşımlar"

format:
  html:
    theme:
      light:
        - cosmo
        - style/light.scss
      dark:
        - cyborg
        - style/dark.scss
        
    css: style/styles.css
    include-in-header: style/preamble.html
    mainfont: "Jura"
    monofont: "Source Code Pro"
    lang: tr

comments:
    giscus: 
      repo: acarzfr/acarzfr.github.io
      repo-id: R_kgDOQROreg
      category: Announcements
      category-id: DIC_kwDOQROres4Cxiyp
      mapping: pathname
      reactions-enabled: true
      input-position: bottom
      theme: 
        dark: dark_tritanopia
        light: light_tritanopia
      language: tr
